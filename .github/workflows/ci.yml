name: native workflow
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Go formatting and generated workflow
        run: |
          test -z "$(gofmt -l cmd internal)"
          python3 scripts/generate_workflow.py
          git diff --exit-code -- public/info.plist
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o build/vsc-host ./cmd/vsc
      - run: python3 scripts/acceptance.py --binary build/vsc-host
      - run: python3 scripts/panel_acceptance.py --binary build/vsc-host
      - if: runner.os == 'Linux'
        run: |
          python3 scripts/build_workflow.py
          python3 scripts/build_workflow.py --target macos --skip-build --dev
          python3 scripts/verify_package.py build/vsc.alfredworkflow build/vsc-dev.alfredworkflow
          python3 scripts/acceptance.py --benchmark --output build/acceptance-linux.json
          python3 scripts/panel_acceptance.py
      - if: runner.os == 'macOS'
        run: |
          python3 scripts/build_workflow.py --target macos
          lipo -archs build/vsc
      - if: runner.os == 'macOS'
        name: Verify Go arm64 ad-hoc signature
        # Go internally signs arm64, while its amd64 output is intentionally unsigned.
        run: codesign --verify --verbose=2 build/vsc-darwin-arm64
      - if: runner.os == 'macOS'
        name: Run universal macOS binary
        run: build/vsc version
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: vsc-native
          if-no-files-found: error
          retention-days: 30
          path: |
            build/*.alfredworkflow
            build/vsc-linux-amd64
            build/SHA256SUMS
            build/acceptance-linux.json
            build/panel-acceptance.json
            docs/MACOS-ACCEPTANCE.zh-CN.md
            docs/MIGRATION.zh-CN.md
            scripts/migrate-v2.sh
