<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VSC Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍃</text></svg>" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <nav id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">🍃</span>
      </div>
      <div class="nav-items">
        <button class="nav-item active" data-view="records" title="项目">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
        </button>
        <button class="nav-item" data-view="trash" title="回收站">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
        <button class="nav-item" data-view="settings" title="设置">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main id="main">
      <!-- Top Bar -->
      <header id="topbar">
        <div class="search-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search-input" placeholder="搜索项目..." autocomplete="off" />
        </div>
        <div class="topbar-actions">
          <div class="theme-switch" id="theme-switch">
            <span class="theme-label">☀️</span>
            <div class="switch-track" id="switch-track">
              <span class="switch-thumb"></span>
            </div>
            <span class="theme-label">🌙</span>
          </div>
        </div>
      </header>

      <!-- Content Area -->
      <div id="content">
        <!-- Records View (main page with stats) -->
        <section id="view-records" class="view active">
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-value" id="stat-projects">0</div>
              <div class="stat-label">项目</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-trash">0</div>
              <div class="stat-label">回收站</div>
            </div>
            <div class="stat-card">
              <div class="stat-value" id="stat-git">0</div>
              <div class="stat-label">Git 仓库</div>
            </div>
          </div>

          <div class="view-controls">
            <div class="view-toggle">
              <button class="toggle-btn active" id="toggle-card" data-mode="card">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="12" x="3" y="3" rx="1"/><rect width="7" height="9" x="14" y="3" rx="1"/><rect width="7" height="5" x="14" y="14" rx="1"/><rect width="7" height="9" x="3" y="16" rx="1"/></svg>
              </button>
              <button class="toggle-btn" id="toggle-table" data-mode="table">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
              </button>
            </div>
            <select id="sort-select" class="select">
              <option value="recent">最近打开</option>
              <option value="name">名称</option>
            </select>
          </div>
          <div id="records-list" class="records-list card-view">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Trash View -->
        <section id="view-trash" class="view">
          <div class="view-header">
            <h2>回收站</h2>
            <button class="btn btn-danger" id="btn-clear-trash">清空全部</button>
          </div>
          <div id="trash-list" class="trash-list">
            <!-- Populated by JS -->
          </div>
        </section>

        <!-- Settings View -->
        <section id="view-settings" class="view">
          <div class="view-header">
            <h2>设置</h2>
          </div>
          <div class="settings-section">
            <h3>目录配置</h3>
            <div id="dir-list" class="dir-list">
              <!-- Populated by JS -->
            </div>
            <div class="dir-actions">
              <button class="btn btn-secondary" id="btn-add-dir">添加目录</button>
            </div>
          </div>
          <div class="settings-section">
            <h3>数据管理</h3>
            <div class="data-actions">
              <button class="btn btn-secondary" id="btn-export">导出数据</button>
              <button class="btn btn-secondary" id="btn-import">导入数据</button>
              <button class="btn btn-primary" id="btn-rebuild-settings">重建索引</button>
            </div>
          </div>
          <div class="settings-section">
            <h3>关于</h3>
            <p class="about-text">VSC Dashboard v1.0</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Confirm Dialog -->
  <div id="dialog-overlay" class="dialog-overlay hidden">
    <div class="dialog">
      <div class="dialog-title" id="dialog-title">确认</div>
      <div class="dialog-body" id="dialog-body">确定要执行此操作吗？</div>
      <div class="dialog-actions">
        <button class="btn btn-secondary" id="dialog-cancel">取消</button>
        <button class="btn btn-danger" id="dialog-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
