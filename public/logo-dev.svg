<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Gradient for the main background (slightly different for dev) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the code bracket -->
    <linearGradient id="codeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E0E7FF;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for the search circle -->
    <linearGradient id="searchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="80" ry="80" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Code brackets representing IDE/VSCode -->
  <!-- Left bracket < -->
  <path d="M 200 160 L 120 256 L 200 352" 
        fill="none" 
        stroke="url(#codeGradient)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Right bracket > -->
  <path d="M 312 160 L 392 256 L 312 352" 
        fill="none" 
        stroke="url(#codeGradient)" 
        stroke-width="36" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Search/magnifier circle in the center -->
  <circle cx="256" cy="240" r="50" 
          fill="none" 
          stroke="url(#searchGradient)" 
          stroke-width="16"/>
  
  <!-- Search handle -->
  <line x1="292" y1="276" x2="330" y2="314" 
        stroke="url(#searchGradient)" 
        stroke-width="16" 
        stroke-linecap="round"/>
  
  <!-- Speed lines / lightning accent (representing fast search) -->
  <path d="M 250 320 L 262 350 L 245 350 L 256 390" 
        fill="none" 
        stroke="#FCD34D" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Dev indicator: small green dot in bottom-right corner -->
  <circle cx="420" cy="420" r="28" fill="#10B981"/>
  <circle cx="420" cy="420" r="22" fill="#34D399"/>
  <circle cx="414" cy="414" r="8" fill="#6EE7B7" opacity="0.6"/>
</svg>
